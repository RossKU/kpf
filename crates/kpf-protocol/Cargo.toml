[package]
name = "kpf-protocol"
description = "KPF protocol core: pinned artifacts, state codecs, payoff math, transaction builders, signing, fees, engine verification"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[dependencies]
blake3.workspace = true
borsh = "1"
kaspa-addresses.workspace = true
kaspa-consensus-core.workspace = true
kaspa-txscript.workspace = true
kaspa-hashes.workspace = true
kaspa-seq-commit.workspace = true
kaspa-smt.workspace = true
kaspa-txscript-errors.workspace = true
secp256k1.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
silverscript-abi.workspace = true
thiserror.workspace = true

[features]
# The tests of the forms before the thin one (they are not in the default run).
legacy = []

# Every test file is listed here (autotests is off): one that is not listed is not run.

[[test]]
name = "audit3_tooling"
path = "tests/audit3_tooling.rs"
required-features = ["legacy"]

