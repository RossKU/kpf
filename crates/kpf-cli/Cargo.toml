[package]
name = "kpf-cli"
description = "KPF command line: keys, addresses, state inspection, quotes and transaction builders for testnet-10"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[lib]
name = "kpf_cli"
path = "src/lib.rs"

[[bin]]
name = "kpf"
path = "src/main.rs"

[dependencies]
kaspa-consensus-core.workspace = true
kpf-protocol.workspace = true
secp256k1.workspace = true
serde_json.workspace = true
# Plain ws:// wRPC to a node the user names; no TLS code is linked.
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[features]
# The tests of the forms before the thin one (they are not in the default run).
legacy = []

# Every test file is listed here (autotests is off): one that is not listed is not run.

[[test]]
name = "audit3_cli"
path = "tests/audit3_cli.rs"
required-features = ["legacy"]

